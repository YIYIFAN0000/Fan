seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  output_dir: outputs/smoke
  sheep_collagen_fasta: data/raw/sheep_collagen.fasta
  amp_positive_csv: data/processed/smoke_amp_positive.csv
  non_amp_negative_csv: data/processed/smoke_non_amp_negative.csv
  collagen_windows_csv: data/processed/smoke_sheep_collagen_windows.csv
  train_dataset_csv: data/processed/smoke_train_dataset.csv
  candidate_pool_csv: data/processed/smoke_candidate_pool.csv
  predictor_dir: outputs/smoke/predictors
  checkpoint_dir: outputs/smoke/checkpoints

data:
  seq_len: 30
  collagen_stride: 12
  min_unique_ratio: 0.25
  min_collagen_motif_score: 0.35
  min_glycine_frame_fraction: 0.40
  min_len: 6
  max_len: 30
  collagen_window_min_len: 6
  collagen_window_max_len: 30
  max_collagen_windows: 2000
  negative_samples: 80
  negative_strategy_version: collagen_decoy_v3
  variable_length_version: masked_length_head_v1

model:
  vocab_size: 20
  latent_dim: 16
  hidden_dim: 32
  predictor_hidden_dim: 32

esm:
  enabled: true
  model_name: facebook/esm2_t6_8M_UR50D
  local_files_only: true
  embedding_mode: token
  embedding_dim: 320
  batch_size: 16
  cache_dir: data/processed/esm2_cache

predictors:
  epochs: 1
  batch_size: 32
  learning_rate: 0.001

gan:
  epochs: 2
  batch_size: 16
  critic_steps: 1
  learning_rate: 0.0002
  gradient_penalty_weight: 10.0
  amp_reward_weight: 0.35
  toxicity_penalty_weight: 0.15
  collagen_reward_weight: 0.10
  collagen_frame_sharpness: 5.0
  diversity_reward_weight: 0.08
  length_distribution_weight: 0.25
  composition_penalty_weight: 0.45
  low_complexity_penalty_weight: 0.35
  repeated_motif_penalty_weight: 0.60
  max_positive_fraction: 0.36
  max_arginine_fraction: 0.20
  max_lysine_fraction: 0.20
  max_proline_fraction: 0.42
  max_glycine_fraction: 0.46
  max_charge_density: 0.30
  min_sequence_entropy: 0.50
  penalized_motifs:
    - GPP
    - PPP
    - PGP
    - PPG
    - RRR
    - KKK
    - RKR
    - KRK
  length_temperature: 1.0
  real_collagen_fraction: 0.25
  save_every: 1

generation:
  num_samples: 40
  temperature: 0.95
  length_temperature: 1.0
  top_k: 30
  batch_size: 64
  max_rounds: 10
  collagen_guided_decoding: false
  xy_proline_boost: 1.0

filtering:
  min_charge: 1.0
  max_charge: 6.0
  max_charge_density: 0.34
  min_hydrophobic_fraction: 0.30
  max_hydrophobic_fraction: 0.75
  max_cysteines: 1
  max_repeat_fraction: 0.40
  max_positive_fraction: 0.42
  max_arginine_fraction: 0.26
  max_lysine_fraction: 0.26
  max_proline_fraction: 0.50
  max_glycine_fraction: 0.50
  max_longest_run_fraction: 0.28
  max_dipeptide_repeat_fraction: 0.40
  max_tripeptide_repeat_fraction: 0.34
  min_sequence_entropy: 0.42
  min_amp_probability: 0.30
  max_toxicity_probability: 0.80
  min_collagen_motif_score: 0.25
  min_glycine_frame_fraction: 0.30
  max_similarity_to_training: 0.95
  similarity_reference_limit: 2000

ranking:
  amp_weight: 0.35
  toxicity_weight: 0.20
  charge_weight: 0.06
  preferred_charge_min: 1.0
  preferred_charge_max: 5.0
  charge_excess_penalty_weight: 0.45
  hydrophobic_weight: 0.10
  collagen_weight: 0.16
  xy_proline_weight: 0.03
  novelty_penalty_weight: 0.10
  novelty_threshold: 0.95
  repeat_penalty_weight: 0.08
  dipeptide_repeat_penalty_weight: 0.22
  tripeptide_repeat_penalty_weight: 0.28
  longest_run_penalty_weight: 0.10
  positive_fraction_penalty_weight: 0.22
  arginine_fraction_penalty_weight: 0.22
  proline_fraction_penalty_weight: 0.12
  glycine_fraction_penalty_weight: 0.08
  low_entropy_penalty_weight: 0.28
  max_selected_similarity: 0.80
